name: Deploy Firebase on main

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: firebase-uplang-production

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    environment: beta
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build web app
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_EMULATORS: "false"
        run: |
          : "${VITE_FIREBASE_API_KEY:?Set VITE_FIREBASE_API_KEY in the beta environment}"
          : "${VITE_FIREBASE_AUTH_DOMAIN:?Set VITE_FIREBASE_AUTH_DOMAIN in the beta environment}"
          : "${VITE_FIREBASE_PROJECT_ID:?Set VITE_FIREBASE_PROJECT_ID in the beta environment}"
          : "${VITE_FIREBASE_APP_ID:?Set VITE_FIREBASE_APP_ID in the beta environment}"
          if [[ "$VITE_FIREBASE_PROJECT_ID" != "uplang-98cca" ]]; then
            echo "::error::VITE_FIREBASE_PROJECT_ID must match the deployment project uplang-98cca."
            exit 1
          fi
          npm run build
      - name: Deploy Firestore, quiz API, and Hosting
        env:
          FIREBASE_DEPLOY_CREDENTIALS: ${{ secrets.FIREBASE_PRODUCTION_DEPLOY_SA }}
        run: |
          : "${FIREBASE_DEPLOY_CREDENTIALS:?Set FIREBASE_PRODUCTION_DEPLOY_SA in the beta environment}"
          credentials="$(mktemp "$RUNNER_TEMP/firebase-credentials.XXXXXX")"
          trap 'rm -f "$credentials"' EXIT
          printf '%s' "$FIREBASE_DEPLOY_CREDENTIALS" > "$credentials"
          unset FIREBASE_DEPLOY_CREDENTIALS
          export GOOGLE_APPLICATION_CREDENTIALS="$credentials"
          npx --yes firebase-tools@15.34.0 deploy \
            --project uplang-98cca \
            --only firestore,functions:quizApi,hosting \
            --non-interactive
